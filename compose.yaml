services:
  api:
    build: .
    image: quality-server:local
    restart: unless-stopped
    init: true
    user: "${QUALITY_UID:-1000}:${QUALITY_GID:-1000}"
    env_file:
      - "${QUALITY_ENV_FILE:-.env}"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "8787"
      DATA_DIR: /var/lib/agentscore-storage/data
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      # Explicit internal HTTP profile for the corporate server's existing URL.
      CORS_ORIGINS: "${QUALITY_PUBLIC_ORIGIN:-http://192.168.68.41:8787}"
      QUALITY_INTERNAL_HTTP: "${QUALITY_INTERNAL_HTTP:-true}"
      TRUST_PROXY: "${QUALITY_TRUST_PROXY:-0}"
      # Corporate MySQL profile: existing credentials stay in the server's .env.
      CHAT_SOURCE_BACKEND: mysql
      CHAT_SOURCE_CORPORATE_PROFILE: "true"
      CHAT_SOURCE_MYSQL_TLS: "${CHAT_SOURCE_MYSQL_TLS:-false}"
      CHAT_SOURCE_VPN_PROFILE: "false"
      AGENTSCORE_LAPTOP_PROFILE: "0"
    ports:
      - "${QUALITY_BIND_HOST:-192.168.68.41}:${QUALITY_HTTP_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: "${QUALITY_STORAGE_DIR:-/var/lib/agentscore-storage}"
        target: /var/lib/agentscore-storage
        bind:
          create_host_path: false
    stop_grace_period: 60s
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
