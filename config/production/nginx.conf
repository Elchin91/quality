server {
    listen 443 ssl;
    server_name quality.internal.example;
    ssl_certificate /etc/agentscore/tls/fullchain.pem;
    ssl_certificate_key /etc/agentscore/tls/privkey.pem;
    # 200 MiB file plus multipart overhead; API still enforces 200 MiB per file.
    client_max_body_size 210m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
